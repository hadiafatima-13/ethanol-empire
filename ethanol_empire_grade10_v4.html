<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ethanol Empire — Visual Game Edition</title>
<style>
:root{
 --bg:#07111f;--panel:#0e1d31;--panel2:#122743;--line:#29425f;--text:#eef7ff;--muted:#90a9c4;
 --cyan:#4bd8ff;--green:#6bf0a2;--gold:#ffd263;--red:#ff7280;--purple:#a993ff;--blue:#5f91ff;
 --shadow:0 24px 70px rgba(0,0,0,.35)
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 30% -10%,#173d6d 0,#0b1c31 33%,#07111f 70%);color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.screen{display:none;min-height:100vh}.screen.active{display:block}.wrap{max-width:1280px;margin:auto;padding:18px}.glass{background:linear-gradient(180deg,rgba(18,39,67,.93),rgba(9,24,42,.94));border:1px solid rgba(255,255,255,.09);border-radius:26px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}
/* menu */
.menu-shell{min-height:calc(100vh - 36px);display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden}.menu-copy{padding:52px;display:flex;flex-direction:column;justify-content:center;position:relative}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);font-weight:900}.brand{font-size:clamp(54px,8vw,94px);line-height:.86;margin:14px 0 18px;font-weight:1000;letter-spacing:-.065em}.brand span{display:block;background:linear-gradient(100deg,#fff,#80eaff 52%,#84ffad);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{font-size:18px;line-height:1.5;color:#cfe0f2;max-width:620px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}.btn{border:0;border-radius:16px;padding:14px 19px;font-weight:900;background:linear-gradient(135deg,#92edff,#82ffac);color:#07111f;box-shadow:0 10px 30px rgba(75,216,255,.18);transition:.18s}.btn:hover{transform:translateY(-2px)}.btn.secondary{background:#17304f;color:#fff;border:1px solid rgba(255,255,255,.08);box-shadow:none}.btn.danger{background:#4a2732;color:#fff}.menu-art{position:relative;min-height:650px;background:linear-gradient(180deg,#0e2745 0%,#0a192b 58%,#0c281d 58%);overflow:hidden}.menu-art:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 18%,rgba(255,210,99,.20),transparent 14%),linear-gradient(120deg,transparent 0 42%,rgba(255,255,255,.02) 42% 44%,transparent 44%)}.city{position:absolute;left:6%;right:6%;bottom:8%;height:56%}.factory-block{position:absolute;bottom:0;border:2px solid #36597a;background:linear-gradient(180deg,#1c4169,#142f50);border-radius:18px 18px 8px 8px;box-shadow:inset 0 0 30px rgba(75,216,255,.05)}.factory-block:after{content:"";position:absolute;left:12%;right:12%;bottom:12%;height:28%;border-radius:10px;background:#69d8ff22;border:1px solid #70dcff55}.tower{position:absolute;bottom:0;width:70px;border-radius:26px 26px 10px 10px;background:linear-gradient(180deg,#8defff,#2f6589 28%,#1a3958);border:2px solid #6cdfff55}.pipe{position:absolute;border:8px solid #55718d;border-radius:30px}.bubble{position:absolute;border-radius:50%;background:rgba(143,239,255,.25);border:1px solid rgba(143,239,255,.5);animation:bubble 3.6s linear infinite}@keyframes bubble{from{transform:translateY(0) scale(.8);opacity:.8}to{transform:translateY(-180px) scale(1.3);opacity:0}}.menu-hud{position:absolute;left:28px;right:28px;top:28px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{padding:12px 14px;border-radius:16px;background:#0b1b2fbb;border:1px solid rgba(255,255,255,.09);font-size:12px}.mini b{font-size:20px;display:block;margin-top:3px}.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;background:#102945;border:1px solid rgba(255,255,255,.08);font-size:12px;color:#d5e4f4}.mission-strip{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}.mission-dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#122945;border:1px solid rgba(255,255,255,.08);font-size:19px}
/* game */
.game-grid{display:grid;grid-template-columns:90px 1fr;gap:14px;min-height:calc(100vh - 36px)}.side{padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:11px;position:sticky;top:18px;height:calc(100vh - 36px)}.side-logo{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,#21476e,#17344f);display:grid;place-items:center;font-size:28px}.sidebtn{width:54px;height:54px;border-radius:17px;border:1px solid rgba(255,255,255,.08);background:#10253e;color:#fff;font-size:22px}.sidebtn.active{background:linear-gradient(135deg,#22577b,#1e573a);outline:2px solid rgba(75,216,255,.26)}.side-spacer{flex:1}.main{display:grid;grid-template-rows:auto 1fr;gap:14px}.hudbar{padding:13px;display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:10px;align-items:center}.mission-title{font-size:24px;font-weight:1000;letter-spacing:-.03em}.stat{padding:10px 12px;border-radius:16px;background:#0c1d31;border:1px solid rgba(255,255,255,.07)}.stat label{display:block;color:var(--muted);font-size:11px;font-weight:800;margin-bottom:7px}.bar{height:8px;border-radius:999px;background:#20324a;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));width:60%;transition:.25s}.score{font-size:28px;font-weight:1000;color:var(--gold)}
.stage{display:grid;grid-template-columns:1fr 340px;gap:14px}.world{position:relative;min-height:680px;overflow:hidden;background:linear-gradient(180deg,#15365a 0%,#10243d 44%,#16331f 44%,#0e2518 100%);border-radius:26px;border:1px solid rgba(255,255,255,.08)}.world:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 12%,rgba(255,220,120,.24),transparent 12%),linear-gradient(180deg,transparent 0 78%,rgba(0,0,0,.22) 78%)}.cloud{position:absolute;width:120px;height:36px;border-radius:40px;background:#d8ecff1e;filter:blur(.4px)}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:48px;height:48px;left:20px;top:-20px}.cloud:after{width:58px;height:58px;right:18px;top:-28px}.road{position:absolute;left:-5%;right:-5%;bottom:58px;height:105px;background:#192839;transform:rotate(-1deg)}.road:after{content:"";position:absolute;left:0;right:0;top:50%;height:4px;background:repeating-linear-gradient(90deg,#ecf5ff 0 25px,transparent 25px 55px);opacity:.75}.terrain{position:absolute;left:0;right:0;bottom:0;height:80px;background:#0a2013}.lab{position:absolute;bottom:150px;border-radius:20px 20px 10px 10px;background:linear-gradient(180deg,#2f5d86,#1b3c5d);border:2px solid #5485a966;box-shadow:0 18px 40px rgba(0,0,0,.28)}.lab .head{font-weight:900;font-size:12px;padding:10px;color:#eaf7ff}.lab .window{position:absolute;left:14px;right:14px;bottom:14px;height:38px;border-radius:10px;background:#76dcff24;border:1px solid #70d9ff55}.tank{position:absolute;bottom:158px;width:112px;height:174px;border-radius:30px 30px 18px 18px;border:3px solid #81ddff66;background:linear-gradient(180deg,#dffaff 0%,#8eeaff 12%,#245271 32%,#19384f 100%);overflow:hidden}.tank .liquid{position:absolute;left:0;right:0;bottom:0;height:10%;background:linear-gradient(180deg,#93ffba,#34c86f);transition:.5s}.tank .label{position:absolute;top:16px;left:0;right:0;text-align:center;color:#082033;font-weight:1000;font-size:13px}.gauge{position:absolute;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--cyan) var(--deg),#1f344d 0);display:grid;place-items:center;border:4px solid #0d2137}.gauge:after{content:"";width:52px;height:52px;border-radius:50%;background:#0d2137;position:absolute}.gauge b{position:relative;z-index:1;font-size:13px}.item-chip{position:absolute;padding:8px 10px;border-radius:12px;background:#0c2238dd;border:1px solid rgba(255,255,255,.08);font-size:12px;font-weight:900;box-shadow:0 10px 20px rgba(0,0,0,.15)}.fx{position:absolute;pointer-events:none;user-select:none;animation:rise 2.1s ease-out forwards}@keyframes rise{0%{opacity:0;transform:translateY(8px) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translateY(-110px) scale(1.25)}}
.controls{padding:16px;display:grid;gap:12px;align-content:start}.panel{padding:14px;border-radius:20px;background:#0b1d31;border:1px solid rgba(255,255,255,.08)}.panel h3{margin:0 0 10px;font-size:16px}.goal{display:flex;gap:10px;align-items:center}.goal .icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#1f4d6b,#1c5139);font-size:24px}.goal b{font-size:14px}.goal span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.control-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.control{padding:11px;border-radius:16px;background:#102641;border:1px solid rgba(255,255,255,.07)}.control label{display:block;color:#dceafb;font-size:12px;font-weight:900;margin-bottom:7px}.big{font-size:23px;font-weight:1000;color:var(--cyan)}input[type=range]{width:100%}.choice-row{display:flex;gap:7px;flex-wrap:wrap}.choice{padding:9px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:#15304f;color:#fff;font-weight:800;font-size:12px}.choice.selected{background:linear-gradient(135deg,#235d82,#245b3d);outline:2px solid rgba(75,216,255,.2)}.visual-tip{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tip{padding:9px 6px;text-align:center;border-radius:13px;background:#102641;border:1px solid rgba(255,255,255,.06);font-size:11px}.tip em{display:block;font-style:normal;font-size:21px;margin-bottom:3px}.order-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.order{padding:11px;border-radius:15px;background:#102641;border:1px solid rgba(255,255,255,.07)}.order.good{box-shadow:inset 0 0 0 2px rgba(107,240,162,.25)}.order b{font-size:12px}.order .small{margin:4px 0 8px}.small{font-size:11px;color:var(--muted)}select{width:100%;padding:9px;border-radius:12px;background:#112943;color:#fff;border:1px solid rgba(255,255,255,.08)}

/* guided learning */
.guide{padding:14px;border-radius:20px;background:linear-gradient(135deg,#102b47,#123522);border:1px solid rgba(107,240,162,.18)}
.guide-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.guide-head b{font-size:15px}.guide-steps{display:grid;gap:7px}.guide-step{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;padding:8px 9px;border-radius:12px;background:#0b1d31;border:1px solid rgba(255,255,255,.06);font-size:12px;color:#d8e8f8}.guide-step .n{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:#1d4f6d;color:#fff;font-weight:1000}.concept{padding:14px;border-radius:20px;background:linear-gradient(180deg,#0c2036,#0b1a2c);border:1px solid rgba(75,216,255,.18)}.concept .ctitle{display:flex;gap:8px;align-items:center;font-weight:1000;margin-bottom:8px}.concept .cbody{font-size:12px;line-height:1.45;color:#cfe0f2}.concept.success{border-color:rgba(107,240,162,.45);box-shadow:inset 0 0 0 1px rgba(107,240,162,.08)}.concept.success .ctitle{color:var(--green)}.hintbtn{border:0;border-radius:11px;padding:7px 9px;background:#173451;color:#dff5ff;font-size:11px;font-weight:900}.error-card{margin-top:8px;padding:9px 10px;border-radius:12px;background:#351b25;border:1px solid rgba(255,114,128,.24);font-size:11px;color:#ffd8dd}.success-card{margin-top:8px;padding:9px 10px;border-radius:12px;background:#173524;border:1px solid rgba(107,240,162,.25);font-size:11px;color:#d9ffe6}
/* modal/toast */
.overlay{position:fixed;inset:0;background:rgba(3,9,16,.78);display:none;align-items:center;justify-content:center;padding:20px;z-index:40}.overlay.show{display:flex}.dialog{max-width:620px;width:100%;padding:22px}.dialog h2{margin:0 0 8px}.toast{position:fixed;right:18px;bottom:18px;max-width:390px;padding:14px 15px;border-radius:17px;background:#0f263f;border:1px solid rgba(255,255,255,.09);box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start;transform:translateY(20px);opacity:0;transition:.2s;z-index:60}.toast.show{transform:none;opacity:1}.toast .ico{font-size:20px}.toast.good{border-color:#6bf0a266}.toast.bad{border-color:#ff728066}
/* end */
.end-card{padding:32px;text-align:center}.final-score{font-size:88px;line-height:1;font-weight:1000;color:var(--gold);margin:14px}.final-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.final-grid .stat{padding:18px}.final-grid .score{font-size:34px}
@media(max-width:1000px){.menu-shell{grid-template-columns:1fr}.menu-art{min-height:480px}.game-grid{grid-template-columns:1fr}.side{height:auto;position:static;flex-direction:row;justify-content:center}.side-spacer{display:none}.sidebtn,.side-logo{width:46px;height:46px}.hudbar{grid-template-columns:1fr 1fr 1fr}.hudbar .stat:nth-child(n+4){display:none}.stage{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.world{min-height:560px}}@media(max-width:700px){.menu-copy{padding:30px}.controls{grid-template-columns:1fr}.control-grid,.order-grid{grid-template-columns:1fr}.visual-tip{grid-template-columns:1fr 1fr}.hudbar{grid-template-columns:1fr 1fr}.final-grid{grid-template-columns:1fr 1fr}.world{min-height:500px}.brand{font-size:58px}}
</style>
</head>
<body>
<section id="menu" class="screen active"><div class="wrap"><div class="glass menu-shell">
<div class="menu-copy">
 <div class="eyebrow">Grade 10 Chemistry • Hydroxy Compounds</div>
 <h1 class="brand"><span>ETHANOL</span><span>EMPIRE</span></h1>
 <div class="sub">Build the process. Run the plant. Fuel the city.</div>
 <div class="actions"><button class="btn" id="start">▶ Play</button><button class="btn secondary" id="how">How to play</button><button class="btn secondary" id="sound">🔊 Sound</button></div>
 <div class="mission-strip"><span class="pill">🌾 Ferment</span><span class="pill">🏭 Hydrate</span><span class="pill">🔥 Burn</span><span class="pill">🚚 Supply</span><span class="pill">🏆 Master</span></div>
</div>
<div class="menu-art">
 <div class="menu-hud"><div class="mini">Production<b>96%</b></div><div class="mini">Eco Score<b>84</b></div><div class="mini">City Demand<b>High</b></div></div>
 <div class="city">
  <div class="factory-block" style="left:4%;width:180px;height:160px"><div style="padding:14px;font-weight:900">FERMENTER</div></div>
  <div class="tower" style="left:39%;height:250px"></div>
  <div class="factory-block" style="left:50%;width:210px;height:210px"><div style="padding:14px;font-weight:900">HYDRATION</div></div>
  <div class="factory-block" style="right:2%;width:150px;height:125px"><div style="padding:14px;font-weight:900">FUEL</div></div>
  <div class="pipe" style="left:21%;bottom:80px;width:220px;height:80px;border-left:0;border-bottom:0"></div>
  <div class="bubble" style="left:12%;bottom:150px;width:24px;height:24px"></div><div class="bubble" style="left:17%;bottom:170px;width:16px;height:16px;animation-delay:.7s"></div><div class="bubble" style="left:63%;bottom:210px;width:20px;height:20px;animation-delay:1.2s"></div>
 </div>
</div>
</div></div></section>

<section id="game" class="screen"><div class="wrap"><div class="game-grid">
<aside class="glass side"><div class="side-logo">⚗️</div><button class="sidebtn active" id="m1">1</button><button class="sidebtn" id="m2">2</button><button class="sidebtn" id="m3">3</button><button class="sidebtn" id="m4">4</button><button class="sidebtn" id="m5">5</button><div class="side-spacer"></div><button class="sidebtn" id="help">?</button><button class="sidebtn" id="pause">⏸</button><button class="sidebtn" id="quit">✕</button></aside>
<div class="main">
 <div class="glass hudbar"><div><div class="eyebrow">Current mission</div><div class="mission-title" id="title">Biofuel Brew</div></div><div class="stat"><label>Score</label><div class="score" id="score">0</div></div><div class="stat"><label>Economy</label><div class="bar"><span id="economyBar"></span></div></div><div class="stat"><label>Environment</label><div class="bar"><span id="environmentBar"></span></div></div><div class="stat"><label>Health</label><div class="bar"><span id="healthBar"></span></div></div></div>
 <div class="stage"><div class="world" id="world"></div><div class="glass controls" id="controls"></div></div>
</div></div></div></section>

<section id="end" class="screen"><div class="wrap"><div class="glass end-card"><div class="eyebrow">Run Complete</div><div class="mission-title">Ethanol Empire Mastery</div><div class="final-score" id="finalScore">0</div><div id="rank" class="sub" style="margin:auto"></div><div class="final-grid" id="finalGrid"></div><div class="actions" style="justify-content:center"><button class="btn" id="again">↻ Play again</button><button class="btn secondary" id="menuBtn">Main menu</button></div></div></div></section>

<div class="toast" id="toast"><div class="ico" id="toastIco">✅</div><div><b id="toastTitle"></b><div class="small" id="toastText"></div></div></div>
<div class="overlay" id="overlay"><div class="glass dialog"><h2 id="overlayTitle"></h2><div id="overlayBody"></div><div class="actions" style="justify-content:flex-end"><button class="btn" id="close">Close</button></div></div></div>
<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const screens={menu:$('#menu'),game:$('#game'),end:$('#end')};
const missionNames=['Biofuel Brew','Industrial Ethanol','Fuel the City','Supply Industries','Empire Challenge'];
let sound=true, state;
const fresh=()=>({mission:0,score:0,economy:60,environment:60,health:60,energy:60,done:[0,0,0,0,0],paused:false,timer:null});
function show(name){Object.values(screens).forEach(x=>x.classList.remove('active'));screens[name].classList.add('active');scrollTo(0,0)}
function clamp(v){return Math.max(0,Math.min(100,v))}
function beep(f=620,d=.06){if(!sound)return;try{const A=window.AudioContext||window.webkitAudioContext,c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.03;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
function notify(t,x,type='good'){const n=$('#toast');$('#toastTitle').textContent=t;$('#toastText').textContent=x;$('#toastIco').textContent=type==='bad'?'⚠️':'✅';n.className='toast show '+type;clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove('show'),2200);beep(type==='bad'?180:680,.07)}
function setConcept(title,body,success=false){const c=$('#conceptCard');if(!c)return;c.classList.toggle('success',success);c.innerHTML=`<div class="ctitle">${success?'✅':'🧠'} ${title}</div><div class="cbody">${body}</div>`}
function teachError(title,action,concept){notify(title,action,'bad');const c=$('#conceptCard');if(c)c.innerHTML=`<div class="ctitle">⚠️ Check the concept</div><div class="cbody"><b>What went wrong:</b> ${action}<div class="error-card"><b>Remember:</b> ${concept}</div></div>`}
function guideHtml(steps){return `<div class="guide"><div class="guide-head"><b>🧭 Mission Guide</b><button class="hintbtn" id="hintBtn">Show tip</button></div><div class="guide-steps">${steps.map((x,i)=>`<div class="guide-step"><span class="n">${i+1}</span><span>${x}</span></div>`).join('')}</div></div>`}
function hookHint(text){const h=$('#hintBtn');if(h)h.onclick=()=>notify('Tip',text,'good')}
function popup(t,b){$('#overlayTitle').textContent=t;$('#overlayBody').innerHTML=b;$('#overlay').classList.add('show')}
function close(){ $('#overlay').classList.remove('show') }
function add(points,e={}){state.score+=points;Object.entries(e).forEach(([k,v])=>{if(k in state)state[k]=clamp(state[k]+v)});hud()}
function hud(){ $('#score').textContent=Math.max(0,Math.round(state.score));$('#economyBar').style.width=state.economy+'%';$('#environmentBar').style.width=state.environment+'%';$('#healthBar').style.width=state.health+'%';$('#title').textContent=missionNames[state.mission];$$('.sidebtn[id^="m"]').forEach((b,i)=>{b.classList.toggle('active',i===state.mission);if(state.done[i])b.textContent='✓'}) }
function worldBase(){return `<div class="cloud" style="left:8%;top:12%"></div><div class="cloud" style="left:54%;top:17%;transform:scale(.7)"></div><div class="road"></div><div class="terrain"></div>`}
function fx(txt,x,y){const e=document.createElement('div');e.className='fx';e.textContent=txt;e.style.left=x;e.style.top=y;$('#world').appendChild(e);setTimeout(()=>e.remove(),2100)}
function complete(){state.done[state.mission]=1;add(250,{economy:3,health:2});notify('Mission complete','Next area unlocked.');setTimeout(()=>{if(state.mission===4)finish();else{state.mission++;load()}},650)}
function load(){if(state.timer){clearInterval(state.timer);state.timer=null}hud();[mission1,mission2,mission3,mission4,mission5][state.mission]()}

function mission1(){
 $('#world').innerHTML=worldBase()+`<div class="tank" style="left:7%"><div class="label">MIX</div><div class="liquid" id="liq1"></div></div><div class="lab" style="left:29%;width:190px;height:180px"><div class="head">FERMENTER</div><div class="window"></div></div><div class="lab" style="left:62%;width:210px;height:225px"><div class="head">DISTILLATION</div><div class="window"></div></div><div class="item-chip" style="left:18%;top:11%">🌾 Glucose</div><div class="item-chip" style="left:39%;top:18%">🦠 Yeast</div><div class="item-chip" style="left:67%;top:11%">🍶 Ethanol</div>`;
 $('#controls').innerHTML=`<div class="panel goal"><div class="icon">🌾</div><div><b>Make ethanol</b><span>Operate the fermenter, then purify the product.</span></div></div>${guideHtml(['Add yeast to the glucose mixture.','Set the tank between 25–35°C.','Close the oxygen valve, then start the batch.','When ethanol forms, use fractional distillation.'])}<div class="panel"><div class="control-grid"><div class="control"><label>Yeast</label><button class="choice" id="yeast">Add yeast</button></div><div class="control"><label>Oxygen</label><button class="choice selected" id="oxygen">Open</button></div><div class="control"><label>Temperature</label><div class="big"><span id="tempV">20</span>°C</div><input id="temp" type="range" min="10" max="50" value="20"></div><div class="control"><label>Status</label><div class="big" id="status1">Ready</div></div></div><div class="actions"><button class="btn" id="run1">Start</button><button class="btn secondary" id="distill" disabled>Distill</button></div></div><div class="concept" id="conceptCard"><div class="ctitle">🧠 Concept Card</div><div class="cbody">Fermentation converts glucose to ethanol and CO₂ using yeast. It works at 25–35°C without oxygen. The mixture is then purified by fractional distillation.</div></div>`;hookHint('Before pressing Start: yeast should be added, temperature should be 25–35°C, and oxygen should be closed.');
 let yeast=false,open=true,fermented=false;$('#yeast').onclick=()=>{yeast=true;$('#yeast').classList.add('selected');$('#yeast').textContent='Added ✓';notify('Yeast added','Fermentation can now occur.')};$('#oxygen').onclick=()=>{open=!open;$('#oxygen').textContent=open?'Open':'Closed';$('#oxygen').classList.toggle('selected',!open)};$('#temp').oninput=e=>$('#tempV').textContent=e.target.value;$('#run1').onclick=()=>{const t=+$('#temp').value;if(!yeast||open||t<25||t>35){add(-40,{economy:-2});$('#status1').textContent='Fix';let why=[];if(!yeast)why.push('yeast has not been added');if(open)why.push('oxygen valve is still open');if(t<25||t>35)why.push('temperature is outside 25–35°C');teachError('Batch failed',why.join('; ')+'.','Fermentation requires glucose + yeast at 25–35°C in the absence of oxygen.');return} fermented=true;$('#liq1').style.height='68%';$('#status1').textContent='10–15%';$('#distill').disabled=false;add(340,{environment:5,economy:4});for(let i=0;i<6;i++)setTimeout(()=>fx('CO₂',`${37+Math.random()*16}%`,`${44+Math.random()*10}%`),i*160);setConcept('Fermentation successful','Glucose + yeast → ethanol + carbon dioxide. Your settings matched the required conditions, so the batch produced about 10–15% ethanol.',true);notify('Fermentation works','Ethanol + carbon dioxide produced.')};$('#distill').onclick=()=>{if(!fermented)return;$('#liq1').style.height='96%';$('#status1').textContent='96%';add(220,{economy:4});fx('✨','73%','27%');setConcept('Mission concept mastered','Fermentation produces dilute ethanol. Fractional distillation concentrates it to about 96% ethanol.',true);notify('Purified','Fractional distillation raised the ethanol concentration.');setTimeout(complete,550)}
}
function mission2(){
 $('#world').innerHTML=worldBase()+`<div class="lab" style="left:8%;width:180px;height:175px"><div class="head">ETHENE</div><div class="window"></div></div><div class="tower" style="left:38%;height:300px"></div><div class="lab" style="left:50%;width:220px;height:235px"><div class="head">HYDRATION REACTOR</div><div class="window"></div></div><div class="tank" style="right:7%;height:150px"><div class="label">ETHANOL</div><div class="liquid" id="liq2"></div></div><div class="item-chip" style="left:10%;top:13%">C₂H₄</div><div class="item-chip" style="left:46%;top:10%">💨 Steam</div>`;
 $('#controls').innerHTML=`<div class="panel goal"><div class="icon">🏭</div><div><b>Run hydration</b><span>Produce ethanol from ethene and steam.</span></div></div>${guideHtml(['Set the reactor close to 300°C.','Raise pressure to about 6000 kPa.','Choose phosphoric acid as catalyst.','Run the reactor, then compare hydration with fermentation.'])}<div class="panel"><div class="control-grid"><div class="control"><label>Temperature</label><div class="big"><span id="t2v">250</span>°C</div><input id="t2" type="range" min="150" max="400" value="250"></div><div class="control"><label>Pressure</label><div class="big"><span id="p2v">4000</span></div><input id="p2" type="range" min="1000" max="7000" step="500" value="4000"></div><div class="control" style="grid-column:1/-1"><label>Catalyst</label><select id="cat2"><option>None</option><option>Phosphoric acid</option><option>Sulfuric acid</option></select></div></div><button class="btn" id="run2">Run reactor</button></div><div class="panel"><div class="order-grid"><div class="order"><b>⚡ Urgent large order</b><div class="choice-row"><button class="choice a2" data-a="h">Hydration</button><button class="choice a2" data-a="f">Fermentation</button></div></div><div class="order"><b>🌱 Renewable priority</b><div class="choice-row"><button class="choice b2" data-a="f">Fermentation</button><button class="choice b2" data-a="h">Hydration</button></div></div></div></div><div class="concept" id="conceptCard"><div class="ctitle">🧠 Concept Card</div><div class="cbody">Hydration makes ethanol from ethene + steam at about 300°C and 6000 kPa using phosphoric acid. It is fast and continuous, but uses non-renewable ethene and more energy.</div></div>`;hookHint('Check all three reactor settings together: temperature, pressure and catalyst.');
 $('#t2').oninput=e=>$('#t2v').textContent=e.target.value;$('#p2').oninput=e=>$('#p2v').textContent=e.target.value;let r=false,a=false,b=false;$('#run2').onclick=()=>{const T=+$('#t2').value,P=+$('#p2').value,C=$('#cat2').value;if(Math.abs(T-300)<=10&&Math.abs(P-6000)<=500&&C==='Phosphoric acid'){r=true;$('#liq2').style.height='78%';add(380,{economy:6,energy:-5,environment:-3});for(let i=0;i<5;i++)setTimeout(()=>fx('💨',`${52+Math.random()*10}%`,`${35+Math.random()*13}%`),i*120);setConcept('Hydration successful','Ethene + steam produced ethanol because the reactor conditions and catalyst were correct.',true);notify('Reactor online','Hydration produced ethanol.')}else{add(-45,{energy:-2});let why=[];if(Math.abs(T-300)>10)why.push('temperature is not near 300°C');if(Math.abs(P-6000)>500)why.push('pressure is not near 6000 kPa');if(C!=='Phosphoric acid')why.push('the catalyst should be phosphoric acid');teachError('Low conversion',why.join('; ')+'.','Hydration of ethene requires steam, ~300°C, ~6000 kPa and phosphoric acid catalyst.')} check()};$$('.a2').forEach(x=>x.onclick=()=>{if(!r)return notify('Run reactor first','Then compare routes.','bad');if(x.dataset.a==='h'){a=true;x.classList.add('selected');add(140);notify('Correct','Hydration is fast and continuous.')}else{add(-25);teachError('Try again','Fermentation is slower and batch-based, so it is not the best route for an urgent continuous order.','Hydration is fast and continuous; fermentation is slow and batch-based.')}check()});$$('.b2').forEach(x=>x.onclick=()=>{if(!r)return notify('Run reactor first','Then compare routes.','bad');if(x.dataset.a==='f'){b=true;x.classList.add('selected');add(140,{environment:3});notify('Correct','Fermentation uses renewable glucose.')}else{add(-25);teachError('Try again','Hydration uses ethene from crude oil and requires higher-energy conditions.','Fermentation uses renewable glucose and moderate temperature, so it better fits a renewable/low-energy priority.')}check()});function check(){if(r&&a&&b)setTimeout(complete,550)}
}
function mission3(){
 $('#world').innerHTML=worldBase()+`<div class="lab" style="left:8%;width:175px;height:160px"><div class="head">FUEL BLENDER</div><div class="window"></div></div><div class="lab" style="left:38%;width:190px;height:180px"><div class="head">COMBUSTION</div><div class="window"></div></div><div style="position:absolute;right:8%;bottom:155px;font-size:104px">🚗</div><div class="item-chip" style="left:12%;top:14%">⛽ Petrol</div><div class="item-chip" style="left:28%;top:20%">🍶 Ethanol</div>`;
 $('#controls').innerHTML=`<div class="panel goal"><div class="icon">🔥</div><div><b>Fuel the city</b><span>Use alcohol as a fuel and prepare gasohol.</span></div></div>${guideHtml(['Choose an alcohol fuel.','Provide enough oxygen and ignite it.','Observe that combustion releases energy and forms CO₂ + H₂O.','Blend petrol with 10–20% ethanol to make gasohol.'])}<div class="panel"><div class="control-grid"><div class="control"><label>Fuel</label><div class="choice-row"><button class="choice fuel3 selected" data-f="e">Ethanol</button><button class="choice fuel3" data-f="m">Methanol</button></div></div><div class="control"><label>Oxygen</label><div class="big"><span id="o3v">40</span>%</div><input id="o3" type="range" min="0" max="100" value="40"></div></div><button class="btn" id="ignite3">Ignite</button></div><div class="panel"><label class="small">Ethanol in petrol</label><div class="big"><span id="blendV">5</span>%</div><input id="blend" type="range" min="0" max="30" value="5"><button class="btn secondary" id="mix3" style="margin-top:10px">Blend gasohol</button></div><div class="concept" id="conceptCard"><div class="ctitle">🧠 Concept Card</div><div class="cbody">Alcohols burn in oxygen to form carbon dioxide and water while releasing energy. Ethanol can be blended with petrol; the chapter uses a 10–20% ethanol blend as gasohol.</div></div>`;hookHint('Complete combustion needs enough oxygen. For gasohol, move the blend into the 10–20% ethanol range.');
 let fuel='e',burn=false,mix=false;$$('.fuel3').forEach(x=>x.onclick=()=>{$$('.fuel3').forEach(y=>y.classList.remove('selected'));x.classList.add('selected');fuel=x.dataset.f});$('#o3').oninput=e=>$('#o3v').textContent=e.target.value;$('#blend').oninput=e=>$('#blendV').textContent=e.target.value;$('#ignite3').onclick=()=>{if(+$('#o3').value<25){add(-35,{environment:-3});return teachError('Not enough oxygen','The oxygen setting is too low for the intended complete combustion.','Alcohol + oxygen → carbon dioxide + water + energy. Increase oxygen before ignition.')}burn=true;add(300,{energy:7,economy:3});for(let i=0;i<7;i++)setTimeout(()=>fx(i%2?'🔥':'⚡',`${43+Math.random()*12}%`,`${48+Math.random()*8}%`),i*80);setConcept('Combustion successful','Your alcohol burned with oxygen and released energy while forming CO₂ and H₂O.',true);notify('Combustion','CO₂ + H₂O + energy released.');check()};$('#mix3').onclick=()=>{const v=+$('#blend').value;if(v>=10&&v<=20){mix=true;add(250,{environment:6,economy:3});fx('🌿','17%','27%');notify('Gasohol ready','Correct ethanol blend.')}else{add(-25);teachError('Adjust blend','The ethanol percentage is outside the target gasohol range.','For this chapter, petrol blended with about 10–20% ethanol is gasohol.')} check()};function check(){if(burn&&mix)setTimeout(complete,550)}
}
function mission4(){
 const data=[['🏥','Hospital','Disinfectant'],['💊','Pharma','Solvent'],['🧴','Cosmetics','Perfume / lotion'],['🏠','Home','Cleaner / paint']];$('#world').innerHTML=worldBase()+data.map((d,i)=>`<div class="lab" style="left:${6+i*23}%;width:145px;height:${145+(i%2)*25}px"><div class="head">${d[0]} ${d[1]}</div><div class="window"></div></div>`).join('');$('#controls').innerHTML=`<div class="panel goal"><div class="icon">🚚</div><div><b>Supply the city</b><span>Match alcohol uses to real industries.</span></div></div>${guideHtml(['Read what each customer needs.','Choose the material that matches that use.','Deliver ethanol where a solvent, disinfectant or formulation ingredient is needed.','Complete all four deliveries.'])}<div class="panel"><div class="order-grid">${data.map((d,i)=>`<div class="order" id="ord${i}"><b>${d[0]} ${d[1]}</b><div class="small">${d[2]}</div><div class="choice-row"><button class="choice ship" data-i="${i}" data-v="e">Ethanol</button><button class="choice ship" data-i="${i}" data-v="w">Water</button><button class="choice ship" data-i="${i}" data-v="p">Petrol</button></div></div>`).join('')}</div></div><div class="concept" id="conceptCard"><div class="ctitle">🧠 Concept Card</div><div class="cbody">Alcohols are used as disinfectants and antiseptics, as solvents in pharmaceutical products, in perfumes and cosmetics, and in household/industrial cleaners, paints and inks.</div></div>`;hookHint('Ask: is the customer asking for a disinfectant, solvent, or alcohol-containing formulation? If yes, ethanol is the chapter-linked choice.');let done=0;$$('.ship').forEach(x=>x.onclick=()=>{const i=+x.dataset.i,card=$('#ord'+i);if(card.classList.contains('good'))return;if(x.dataset.v==='e'){card.classList.add('good');card.querySelector('.choice-row').innerHTML='<span class="pill">Delivered ✓</span>';done++;add(180,{economy:4,health:i===0?5:1});fx('📦',`${11+i*23}%`,'56%');notify('Delivered',data[i][1]+' supplied.')}else{add(-30);const need=data[i][2];teachError('Wrong item',`The selected material does not match the ${need.toLowerCase()} use shown for this customer.`,`In this chapter, ethanol is used as a disinfectant and as a solvent/formulation ingredient in pharmaceuticals, cosmetics, cleaners, paints and inks.`)}if(done===4){setConcept('Applications mastered','You correctly linked ethanol to disinfectant, pharmaceutical, cosmetic and household/industrial solvent uses.',true);setTimeout(complete,650)}})
}
function mission5(){
 $('#world').innerHTML=worldBase()+`<div class="gauge" id="gauge" style="--deg:360deg;left:6%;top:8%"><b id="time">90</b></div><div class="lab" style="left:28%;width:190px;height:190px"><div class="head">FERMENTATION</div><div class="window"></div></div><div class="lab" style="left:60%;width:200px;height:210px"><div class="head">HYDRATION</div><div class="window"></div></div>`;$('#controls').innerHTML=`<div class="panel goal"><div class="icon">🏆</div><div><b>Final challenge</b><span>Choose the right process for the situation.</span></div></div>${guideHtml(['Watch time, glucose, ethene, plant energy and ethanol stock.','Fermentation uses less energy and renewable glucose, but takes more time.','Hydration is faster, but consumes more plant energy and ethene.','Produce enough stock and deliver every contract before time ends.'])}<div class="panel"><div class="visual-tip" id="res"></div><div class="choice-row" style="margin-top:10px"><button class="choice route selected" data-r="f">Fermentation</button><button class="choice route" data-r="h">Hydration</button></div><button class="btn" id="produce" style="margin-top:10px">Produce batch</button></div><div class="panel"><div id="contracts"></div></div><div class="concept" id="conceptCard"><div class="ctitle">🧠 Concept Card</div><div class="cbody">This mission combines the chapter: fermentation is renewable and lower-energy but slow/batch-based; hydration is fast/continuous but uses non-renewable ethene and high-energy conditions. Choose according to the production need.</div></div>`;hookHint('Low on time? Hydration saves time. Low on energy or prioritizing renewables? Fermentation is the better route.');
 let t=90,stock=0,route='f';const res={g:3,e:3,p:70};const c=[['🏥 Hospital',2,0],['⛽ Fuel station',2,0],['🧴 Cosmetics',1,0],['💊 Pharma',1,0]];$$('.route').forEach(x=>x.onclick=()=>{$$('.route').forEach(y=>y.classList.remove('selected'));x.classList.add('selected');route=x.dataset.r});function render(){$('#res').innerHTML=`<div class="tip"><em>🌾</em>${res.g}</div><div class="tip"><em>🛢️</em>${res.e}</div><div class="tip"><em>⚡</em>${res.p}</div><div class="tip"><em>🍶</em>${stock}</div>`;$('#contracts').innerHTML=c.map((x,i)=>`<div class="order ${x[2]?'good':''}" style="margin-bottom:8px"><b>${x[2]?'✅ ':''}${x[0]}</b>${x[2]?'':`<button class="choice deliver" data-i="${i}" ${stock<x[1]?'disabled':''} style="margin-top:7px">Deliver ${x[1]}</button>`}</div>`).join('');$('#time').textContent=t;$('#gauge').style.setProperty('--deg',(t/90*360)+'deg');$$('.deliver').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(stock<c[i][1])return;stock-=c[i][1];c[i][2]=1;add(220,{economy:4,health:i===0?5:1});notify('Contract complete','Shipment delivered.');render();check()})}$('#produce').onclick=()=>{if(route==='f'){if(res.g<=0||res.p<8)return teachError('No resources','Fermentation cannot run because glucose or plant energy is insufficient.','Fermentation uses glucose and comparatively lower-energy conditions, but it still needs both feedstock and energy.');res.g--;res.p-=8;t=Math.max(0,t-12);stock++;add(90,{environment:3})}else{if(res.e<=0||res.p<16)return teachError('No resources','Hydration cannot run because ethene or plant energy is insufficient.','Hydration uses ethene and requires more energy because of its high-temperature and high-pressure conditions.');res.e--;res.p-=16;t=Math.max(0,t-5);stock++;add(90,{economy:2,environment:-2})}fx('🍶',route==='f'?'35%':'68%','49%');render();check()};function check(force=false){if(c.every(x=>x[2])){clearInterval(state.timer);state.timer=null;add(500,{economy:8,environment:5,health:5});setConcept('Chapter mastery complete','You balanced both ethanol-production routes and supplied all real-world applications successfully.',true);notify('Empire complete','All contracts delivered.');setTimeout(finish,750)}else if(force){notify('Time up','Calculating final score.','bad');setTimeout(finish,700)}}state.timer=setInterval(()=>{if(state.paused)return;t=Math.max(0,t-1);render();if(t===0){clearInterval(state.timer);state.timer=null;check(true)}},1000);render()
}
function finish(){if(state.timer){clearInterval(state.timer);state.timer=null}const avg=Math.round((state.economy+state.environment+state.health+state.energy)/4),total=Math.max(0,Math.round(state.score+avg*6));$('#finalScore').textContent=total;$('#rank').textContent='Rank: '+(total>=5200?'Master Chemist':total>=3900?'Industrial Chemist':total>=2700?'Process Specialist':'Apprentice Chemist');$('#finalGrid').innerHTML=`<div class="stat"><label>Economy</label><div class="score">${Math.round(state.economy)}%</div></div><div class="stat"><label>Environment</label><div class="score">${Math.round(state.environment)}%</div></div><div class="stat"><label>Health</label><div class="score">${Math.round(state.health)}%</div></div><div class="stat"><label>Energy</label><div class="score">${Math.round(state.energy)}%</div></div>`;show('end')}
$('#start').onclick=()=>{state=fresh();show('game');load()};$('#again').onclick=()=>{state=fresh();show('game');load()};$('#menuBtn').onclick=()=>show('menu');$('#how').onclick=()=>popup('How to play','<p><b>Every mission now has a Mission Guide and Concept Card.</b></p><ol><li>Follow the numbered guide steps.</li><li>Use the controls to complete the chemistry task.</li><li>If something is wrong, the game explains exactly what failed and reminds you of the concept.</li><li>When you succeed, the Concept Card updates to show what your result proves.</li></ol><p>Use the <b>Show tip</b> button whenever you need a hint.</p>');$('#help').onclick=()=>popup('Quick help','<div class="visual-tip"><div class="tip"><em>🌡️</em>Ferment 25–35°C</div><div class="tip"><em>🚫</em>Ferment without O₂</div><div class="tip"><em>🏭</em>Hydrate ~300°C / 6000 kPa</div><div class="tip"><em>⛽</em>Gasohol 10–20% ethanol</div></div><p style="margin-top:12px">For the current mission, read the numbered Mission Guide on the right and use <b>Show tip</b>.</p>');$('#close').onclick=close;$('#overlay').onclick=e=>{if(e.target.id==='overlay')close()};$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'🔊 Sound':'🔇 Muted';beep()};$('#pause').onclick=()=>{state.paused=!state.paused;$('#pause').textContent=state.paused?'▶':'⏸';if(state.paused)popup('Paused','<p>Press close, then resume when ready.</p>')};$('#quit').onclick=()=>popup('Quit?','<p>Return to the main menu?</p><button class="btn danger" id="confirmQuit">Quit</button>');document.addEventListener('click',e=>{if(e.target&&e.target.id==='confirmQuit'){if(state&&state.timer)clearInterval(state.timer);close();show('menu')}});
state=fresh();hud();
})();
